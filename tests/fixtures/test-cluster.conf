# cluster.conf used by the test harness. Points every writable path at the
# per-case temp tree, shrinks the budgets, and sources a real platform profile so
# the threshold tests exercise actual floors.
AAT_HOME="${AAT_HOME_OVERRIDE:?}"
RESULTS_DIR="$AAT_HOME/results"
STATE_DIR="$AAT_HOME/state"
LOG_DIR="$AAT_HOME/log"
REPORT_DIR="$AAT_HOME/reports"
LOGS_DIR="$AAT_HOME/logs"
VALID_CONFIG_DIR="$AAT_HOME/valid-config"
RACK_INVENTORY="${TEST_INVENTORY:?}"
WORKLOAD_CONF="${TEST_WORKLOADS:?}"

PLATFORM_PROFILE="${TEST_PROFILE:-gb300-nvl72}"
CLUSTER_NAME=testcluster
_prof="$(cd "$(dirname "${BASH_SOURCE[0]}")/../../conf/profiles" && pwd)/$PLATFORM_PROFILE.conf"
[ -r "$_prof" ] && . "$_prof"

LLMB_INSTALL="$AAT_HOME/llmb"
LLMB_VENV=
LLMB_SUBCOMMAND=auto
LLMB_IMAGE_NAME=nvidia+nemo+26.04.01.sqsh
LLMB_IMAGE_SRC="$LLMB_INSTALL/images"
LLMB_IMAGE_LOCAL=/raid/llmb
LLMB_STAGE_IMAGE=1

PARTITION=defq
GPUS_PER_NODE=4
NODES_PER_RACK=18
NODE_HEALTH_DRIVER=none
SLURM_TOPOLOGY=block

MAX_JOB_HOURS=6
MAX_RACK_JOB_HOURS=30
MAX_SUBMITS_PER_CYCLE="${TEST_MAX_SUBMITS:-8}"
SUBMIT_SLEEP=0
QUEUE_DEPTH_LIMIT="${TEST_QUEUE_LIMIT:-999}"
ON_RACK_FAIL=drain
RETRY_FAILED=0
RETRY_INFRA_FAIL=1
MAX_ATTEMPTS=3
OUTLIER_FRAC=0.05
OUTLIER_MIN_SAMPLES=8
RUN_AS_USER=root
ALLOW_ROOT=1
LLMB_EXTRA_ENV="NCCL_SOCKET_IFNAME=${TEST_NIC:-eth0}"
LOG_LEVEL="${TEST_LOG_LEVEL:-WARN}"
