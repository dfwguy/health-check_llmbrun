# ============================================================================
# workloads.conf - the validation matrix, in execution order.
#
# Platform-neutral: rack geometry and bandwidth floors come from the platform
# profile that conf/cluster.conf sources (see conf/profiles/). Nothing here
# names a specific cluster, GPU, node or site.
#
# Order in this file IS the gating order: a rack becomes eligible for a workload
# only once every workload in its `gate=` is DONE for that rack.
#
# Fields
#   runner=llmb|sbatch|local   how it is launched
#   scope=node|rack|group      unit of work (group = racks_per_job racks)
#   gate=a,b                   prerequisites ('-' for none)
#   llmb_workload=             -w value
#   llmb_size=                 -s value ('-' to omit)
#   dtype=                     --dtype value ('-' to omit)
#   racks_per_job=N            scope=rack -> 1 ; scope=group -> N
#   scale=auto|N               auto = racks_per_job * GPUS_PER_RACK
#   scale_flag=force|proxy|-   --force (non-whitelisted scale) / --proxy
#   pin=auto|nodelist|exclude|none
#                              auto: 1 rack -> nodelist, >1 -> exclude when
#                              SLURM_TOPOLOGY=block
#   metric=nccl_busbw|tflops|- how results are scored
#   thresholds=k:v,k:v         absolute floors; an EMPTY value means "no floor",
#                              so an uncalibrated profile still runs and relies
#                              on the fleet-relative outlier gate
#   runs=N                     repeat count
#   env=                       extra KEY=VAL for llmb-run
#   sbatch=                    runner=sbatch only: file under jobs/
#   enabled=0|1                skip without deleting
# ============================================================================

# ---- 1. per-node GPU diagnostics -------------------------------------------
workload dcgm \
    runner=sbatch scope=node gate=- \
    sbatch=dcgm.sbatch runs=1 \
    metric=- thresholds=-

# ---- 2. per-rack NCCL fabric sweep (one NVLink domain) ---------------------
# One llmb job covers all five collectives.
workload nccl_single \
    runner=llmb scope=rack gate=dcgm \
    llmb_workload=microbenchmark_nccl llmb_size=nccl dtype=fp8 \
    racks_per_job=1 scale=auto scale_flag=force pin=auto \
    metric=nccl_busbw runs=1 \
    thresholds=all_reduce:${NCCL_FLOOR_ALL_REDUCE:-},all_gather:${NCCL_FLOOR_ALL_GATHER:-},reduce_scatter:${NCCL_FLOOR_REDUCE_SCATTER:-},alltoall:${NCCL_FLOOR_ALLTOALL:-},sendrecv:${NCCL_FLOOR_SENDRECV:-}

# ---- 3. per-rack pretrain smoke test --------------------------------------
# Proves the container, data path and distributed launch end to end.
workload nemo_single \
    runner=llmb scope=rack gate=nccl_single \
    llmb_workload=${PRETRAIN_WORKLOAD:-pretrain_nemotron-h} \
    llmb_size=${PRETRAIN_SIZE:-56b} dtype=fp8 \
    racks_per_job=1 scale=auto scale_flag=force pin=auto \
    metric=tflops runs=1 thresholds=tflops:${PRETRAIN_FLOOR_TFLOPS:-} \
    env="MAX_STEPS=${PRETRAIN_MAX_STEPS:-2010} TIME_LIMIT=${PRETRAIN_TIME_LIMIT:-3:00:00}"

# ---- 4. multi-rack fabric (scale-out) --------------------------------------
# Gated on every member rack passing its own single-rack sweep.
workload nccl_multi \
    runner=llmb scope=group gate=nccl_single \
    llmb_workload=microbenchmark_nccl llmb_size=nccl dtype=fp8 \
    racks_per_job=${MULTI_RACKS_PER_JOB:-4} scale=auto scale_flag=force pin=auto \
    metric=nccl_busbw runs=1 \
    thresholds=all_reduce:${NCCL_FLOOR_MULTI_ALL_REDUCE:-},all_gather:${NCCL_FLOOR_MULTI_ALL_GATHER:-},reduce_scatter:${NCCL_FLOOR_MULTI_REDUCE_SCATTER:-},alltoall:${NCCL_FLOOR_MULTI_ALLTOALL:-},sendrecv:${NCCL_FLOOR_MULTI_SENDRECV:-}

# ---- 5. multi-rack soak - enable once 1-4 are green fleet-wide -------------
# Long-running training soak. Disabled by default: turn it on deliberately,
# after the fast checks are clean, and size MAX_STEPS to your soak window.
workload soak \
    runner=llmb scope=group gate=nemo_single,nccl_multi enabled=0 \
    llmb_workload=${SOAK_WORKLOAD:-pretrain_deepseek-v3} \
    llmb_size=${SOAK_SIZE:-671b} dtype=fp8 \
    racks_per_job=${MULTI_RACKS_PER_JOB:-4} scale=${SOAK_SCALE:-auto} \
    scale_flag=${SOAK_SCALE_FLAG:-force} pin=auto \
    metric=tflops runs=1 thresholds=- \
    env="MAX_STEPS=${SOAK_MAX_STEPS:-6600} TIME_LIMIT=${SOAK_TIME_LIMIT:-25:00:00}"
