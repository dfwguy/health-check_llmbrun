# HGX-class x86 node, 8 GPUs per node (H100/H200/B200 HGX).
# There is no NVLink domain larger than a node, so a "rack" here is whatever
# scale-out group you want tested together - set NODES_PER_RACK accordingly
# (8 nodes x 8 GPUs = 64 GPUs is a common choice).
PROFILE_LABEL="HGX 8-GPU node"
PROFILE_GPUS_PER_NODE=8
PROFILE_NODES_PER_RACK=8
NCCL_FLOOR_ALL_REDUCE=
NCCL_FLOOR_ALL_GATHER=
NCCL_FLOOR_REDUCE_SCATTER=
NCCL_FLOOR_ALLTOALL=
NCCL_FLOOR_SENDRECV=
NCCL_FLOOR_MULTI_ALL_REDUCE=
NCCL_FLOOR_MULTI_ALL_GATHER=
NCCL_FLOOR_MULTI_REDUCE_SCATTER=
NCCL_FLOOR_MULTI_ALLTOALL=
NCCL_FLOOR_MULTI_SENDRECV=
PRETRAIN_WORKLOAD=pretrain_nemotron-h
PRETRAIN_SIZE=56b
PRETRAIN_MAX_STEPS=2010
PRETRAIN_TIME_LIMIT=3:00:00
