# NVIDIA GB200 / B200 NVL72 - 18 trays x 4 GPUs = 72 GPUs per NVLink domain.
# Floors start slightly below the GB300 set; calibrate and tighten.
PROFILE_LABEL="GB200 NVL72"
PROFILE_GPUS_PER_NODE=4
PROFILE_NODES_PER_RACK=18
NCCL_FLOOR_ALL_REDUCE=700
NCCL_FLOOR_ALL_GATHER=520
NCCL_FLOOR_REDUCE_SCATTER=540
NCCL_FLOOR_ALLTOALL=520
NCCL_FLOOR_SENDRECV=520
NCCL_FLOOR_MULTI_ALL_REDUCE=350
NCCL_FLOOR_MULTI_ALL_GATHER=260
NCCL_FLOOR_MULTI_REDUCE_SCATTER=260
NCCL_FLOOR_MULTI_ALLTOALL=220
NCCL_FLOOR_MULTI_SENDRECV=260
PRETRAIN_WORKLOAD=pretrain_nemotron-h
PRETRAIN_SIZE=56b
PRETRAIN_MAX_STEPS=2010
PRETRAIN_TIME_LIMIT=3:00:00
