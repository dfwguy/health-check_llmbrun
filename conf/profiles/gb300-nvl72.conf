# NVIDIA GB300 NVL72 - 18 trays x 4 GPUs = 72 GPUs per NVLink domain.
#
# Floors are ~90% of single-rack peak busbw observed on a healthy GB300 NVL72
# fleet (AllReduce 915 / AllGather 689 / RedScatter 709 / AllToAll 690 /
# SendRecv 695 GB/s). These are field observations, not published numbers -
# confirm on your first few racks before trusting them.
PROFILE_LABEL="GB300 NVL72"
PROFILE_GPUS_PER_NODE=4
PROFILE_NODES_PER_RACK=18
NCCL_FLOOR_ALL_REDUCE=820
NCCL_FLOOR_ALL_GATHER=620
NCCL_FLOOR_REDUCE_SCATTER=640
NCCL_FLOOR_ALLTOALL=620
NCCL_FLOOR_SENDRECV=625
# Multi-rack traverses the scale-out fabric, so floors are much lower.
NCCL_FLOOR_MULTI_ALL_REDUCE=400
NCCL_FLOOR_MULTI_ALL_GATHER=300
NCCL_FLOOR_MULTI_REDUCE_SCATTER=300
NCCL_FLOOR_MULTI_ALLTOALL=250
NCCL_FLOOR_MULTI_SENDRECV=300
PRETRAIN_WORKLOAD=pretrain_nemotron-h
PRETRAIN_SIZE=56b
PRETRAIN_MAX_STEPS=2010
PRETRAIN_TIME_LIMIT=3:00:00
