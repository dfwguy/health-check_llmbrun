# NVIDIA VR200 NVL144 - one NVLink domain is 144 GPUs.
# Tray count per rack is site dependent; the interview detects it and overrides
# PROFILE_NODES_PER_RACK. Floors are UNSET until measured - do not guess on a
# platform whose fabric you have not characterised.
PROFILE_LABEL="VR200 NVL144"
PROFILE_GPUS_PER_NODE=4
PROFILE_NODES_PER_RACK=36
NCCL_FLOOR_ALL_REDUCE=
NCCL_FLOOR_ALL_GATHER=
NCCL_FLOOR_REDUCE_SCATTER=
NCCL_FLOOR_ALLTOALL=
NCCL_FLOOR_SENDRECV=
NCCL_FLOOR_MULTI_ALL_REDUCE=
NCCL_FLOOR_MULTI_ALL_GATHER=
NCCL_FLOOR_MULTI_REDUCE_SCATTER=
NCCL_FLOOR_MULTI_ALLTOALL=
NCCL_FLOOR_MULTI_SENDRECV=
PRETRAIN_WORKLOAD=pretrain_nemotron-h
PRETRAIN_SIZE=56b
PRETRAIN_MAX_STEPS=2010
PRETRAIN_TIME_LIMIT=3:00:00
